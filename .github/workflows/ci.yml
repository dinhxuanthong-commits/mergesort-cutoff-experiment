name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests & JaCoCo Coverage
        run: |
          mvn clean test jacoco:report --batch-mode

      - name: Package Executable JAR
        run: |
          mvn package -DskipTests --batch-mode

      - name: Run Smoke-Test Experiment
        run: |
          java -jar target/mergesort-cutoff-experiment-1.0.0.jar --smoke-test
